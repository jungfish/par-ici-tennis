name: Tennis booking

# Paris Tennis ouvre les créneaux à J+6, à 08:00 pile.
# Pour jouer mardi / mercredi / jeudi, il faut donc lancer le script
# le mercredi / jeudi / vendredi (jour de jeu + 1).
#
# Le cron GitHub est en UTC et dérive souvent de plusieurs minutes.
# On déclenche donc volontairement en avance (05:30 UTC = 07:30 Paris l'été,
# 06:30 l'hiver) et l'étape "Wait 08:00" dort jusqu'à 08:00:00 Europe/Paris.

on:
  schedule:
    - cron: '30 5 * * 3,4,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  book:
    name: Book Valeyre 12h/13h at 08:00 Europe/Paris
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create config.json from variables
        env:
          CONFIG_JSON: ${{ vars.CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_JSON:-}" ]; then
            printf "%s" "$CONFIG_JSON" > config.json
            echo "config.json created from CONFIG_JSON variable"
          else
            echo "ERROR: Missing CONFIG_JSON variable." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --production --ignore-scripts

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser (only-shell)
        run: npx playwright install chromium --only-shell

      - name: Wait 08:00 Europe/Paris
        if: github.event_name == 'schedule'
        run: npm run wait

      - name: Run script
        env:
          ACCOUNT_EMAIL: ${{ secrets.ACCOUNT_EMAIL }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_DOMAIN: ${{ secrets.NTFY_DOMAIN }}
        run: npm start
